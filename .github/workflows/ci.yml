name: CI

# Validation only: typecheck, tests, build. Packaging and signing live in
# release.yml and are deliberately absent here — a pull request must never run
# with signing credentials in scope.
on:
  pull_request:
  push:
    branches: [main]
  # The XCUITest job (pennant-mac-ui) can be asked for by hand on any branch, all of it or one test
  workflow_dispatch:
    inputs:
      only:
        description: "One UI test only, as xcodebuild's -only-testing names it (PennantUITests/PennantUITests/testX); empty runs them all"
        required: false
        default: ""

permissions:
  contents: read

# A newer push to the same branch makes the older run pointless
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  pennant-api:
    # The Mac app's generated client (SWIFTUI_REBUILD.md section 4.3): a breaking change to contract/openapi.json fails
    # here. macos-26 is Apple silicon with Xcode 26 by default (Swift 6.2 or later, the macOS 26 SDK), which the
    # package's minimum (macOS 26) and swift-tools-version (6.2) need. No secrets in this job.
    name: PennantAPI (Swift build and test)
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: macos/Packages/PennantAPI
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      # The packages and the generator plugin's build, kept between runs; a new Package.resolved starts afresh
      - uses: actions/cache@v4
        with:
          path: macos/Packages/PennantAPI/.build
          key: pennant-api-${{ runner.os }}-${{ hashFiles('macos/Packages/PennantAPI/Package.resolved') }}
      # Only the versions Package.resolved names: a stale resolved file fails here instead of quietly re-resolving
      - run: swift build --force-resolved-versions
      - run: swift test --force-resolved-versions

  pennant-mac:
    # The Mac app (SWIFTUI_REBUILD.md sections 6 and 8): PennantKit's, PennantDesign's and PennantFeatures' Swift
    # tests, and the app with its UI tests built unsigned. The server is not staged here (PENNANT_SKIP_SERVER=YES: no
    # Node download), so the real-server integration tests and the XCUITests, which need it and a scratch league, run
    # locally in macos/scripts/test.sh, as do the snapshots (skipped when CI is set). Only the versions the
    # Package.resolved files name are used. No secrets.
    name: Mac app (packages and app build)
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - uses: actions/cache@v4
        with:
          path: |
            macos/Packages/PennantKit/.build
            macos/Packages/PennantDesign/.build
            macos/Packages/PennantFeatures/.build
            build/macos-ci/SourcePackages
          key: pennant-mac-${{ runner.os }}-${{ hashFiles('macos/Packages/PennantKit/Package.resolved', 'macos/Packages/PennantDesign/Package.resolved', 'macos/Packages/PennantFeatures/Package.resolved', 'macos/Pennant.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
      - name: PennantKit tests
        working-directory: macos/Packages/PennantKit
        run: swift test --force-resolved-versions
      - name: PennantDesign tests
        working-directory: macos/Packages/PennantDesign
        run: swift test --force-resolved-versions
      - name: PennantFeatures tests
        working-directory: macos/Packages/PennantFeatures
        run: swift test --force-resolved-versions
      - name: Build the app and its UI tests (unsigned, without the server)
        run: >
          xcodebuild -project macos/Pennant.xcodeproj -scheme Pennant -destination 'platform=macOS'
          -derivedDataPath build/macos-ci/DerivedData -clonedSourcePackagesDirPath build/macos-ci/SourcePackages
          -onlyUsePackageVersionsFromResolvedFile -skipPackagePluginValidation
          CODE_SIGNING_ALLOWED=NO PENNANT_SKIP_SERVER=YES build-for-testing

  pennant-mac-ui:
    # The XCUITests (SWIFTUI_REBUILD.md section 8) on GitHub's macOS runner, which has a logged-in GUI session no one is
    # using, so no one's screen is taken over: the app with its bundled server on the synthetic league (never a real
    # save), each test on a scratch folder of its own, as macos/scripts/test.sh runs them locally. The window
    # screenshots, the accessibility audits and the launch timing (N6, Stage B1) are kept as an artifact. Its own job,
    # only for pull requests into feature/swiftui (or by hand), and a hard gate: a failing XCUITest fails the run (it
    # passed on the runner twice in a row before `continue-on-error` was removed, runs 36919366664 and 36922465784). If
    # the runner's UI automation refuses (TCC), the log says so and nothing here changes the runner's security settings.
    # No secrets: the app is built unsigned.
    name: Mac app (XCUITests on the runner)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'feature/swiftui')
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: xcodebuild -version
      - uses: actions/cache@v4
        with:
          path: |
            build/node-runtime
            build/macos-test/DerivedData/SourcePackages
          key: pennant-mac-ui-${{ runner.os }}-${{ hashFiles('scripts/fetch-node-runtime.mjs', 'macos/Pennant.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
      - run: npm ci
      # The package tests ran in pennant-mac; this job is the app, its server and the UI tests
      - name: XCUITests on the synthetic league
        id: xcuitests
        env:
          PENNANT_TEST_NO_PACKAGES: "1"
          PENNANT_TEST_UNSIGNED: "1"
          PENNANT_TEST_SCRATCH: ${{ runner.temp }}/pennant-ui
          PENNANT_TEST_ONLY: ${{ inputs.only }}
        run: macos/scripts/test.sh
      # The outcome on the run's summary page, with the launch timing the kept-payload test recorded
      - name: Say how the XCUITests went, on the run's summary
        if: always()
        env:
          OUTCOME: ${{ steps.xcuitests.outcome }}
        run: |
          if [ "$OUTCOME" = "success" ]; then line="PASSED"; else line="FAILED ($OUTCOME)"; fi
          {
            echo "### Mac app XCUITests: $line"
            echo
            echo "The screenshots, audits and logs are in the xcuitest-screenshots artifact."
            timing=$(cat build/macos-test/screenshots/launch-timing* 2>/dev/null)
            if [ -n "$timing" ]; then echo; echo '```'; echo "$timing"; echo '```'; fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the screenshots, the audits, the launch timing and the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcuitest-screenshots
          path: |
            build/macos-test/screenshots
            build/macos-test/logs
          if-no-files-found: warn
          retention-days: 14

name: Pennant release

# Push a Pennant tag to cut a release:
#   git tag pennant-v0.1.0 && git push origin pennant-v0.1.0
# The tag is `pennant-v` + package.json's version (checked below). Pennant's versions
# are its own and its tags deliberately do NOT start with `v`: upstream's tags
# (v0.1.0 … v0.40.1) are a different project's and must never trigger this workflow
# or collide with these — see D-049.
# Or trigger manually from the Actions tab to get installers without a release.
#
# Pull-request validation is ci.yml. Nothing here runs on a pull request.
on:
  push:
    tags: ['pennant-v*']
  workflow_dispatch:

permissions:
  contents: write

# Mac and Windows are separate jobs rather than a matrix on purpose: the Apple
# signing credentials must reach ONLY the macOS job. electron-builder's CSC_LINK
# is a generic code-signing variable, so a Windows job that can see it will sign
# .exe files with the Apple certificate — producing an invalid Authenticode
# signature that is worse for users than shipping unsigned.
jobs:
  # Gates the release. Both packaging jobs wait on it, so a regression caught
  # here never reaches an installer.
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

      # The version has one source, package.json (server/appInfo.ts). A tag that
      # disagrees would publish installers whose updater manifests say a different
      # version than the release they hang from.
      - name: Tag matches package.json
        if: startsWith(github.ref, 'refs/tags/pennant-v')
        run: |
          expected="pennant-v$(node -p "require('./package.json').version")"
          if [ "$expected" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json (${expected})"
            exit 1
          fi

  macos:
    needs: test
    name: macOS
    runs-on: macos-latest
    # The Apple credentials are secrets of this environment, not of the repository.
    # The environment admits only main and pennant-v* tags, so a pull request or a
    # pushed branch cannot read them even by editing this file. From any other ref
    # the job is refused outright rather than run unsigned.
    environment: macos-signing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # match Electron's bundled Node so the native ABI lines up
          cache: npm

      - run: npm ci
      - run: npm run abi:electron
      - run: npm run desktop:build

      # Until the Apple secrets exist this packages an UNSIGNED app and the
      # verification step below cannot pass. That is intended: it is not weakened to
      # turn CI green. What a signed release needs is in docs/DEVELOPMENT.md.
      #
      # The secrets are exported to electron-builder's variables only when they are
      # set. A missing secret expands to an empty string, and electron-builder reads
      # an empty CSC_LINK as a certificate path relative to the working directory:
      # it stops with "<repo> not a file" before packaging anything, so the unsigned
      # build never happened at all.
      #
      # Notarization uses an App Store Connect API key (Developer role), not an Apple
      # ID and app-specific password: the key reaches only App Store Connect and is
      # revoked on its own, where an app-specific password also opens the account's
      # iCloud data. electron-builder wants the key as a file, so it is written to the
      # runner's temp directory for the one command and removed afterwards.
      - name: Package (signed and notarized when secrets are present)
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -n "${APPLE_CERTIFICATE_P12}" ]; then
            export CSC_LINK="${APPLE_CERTIFICATE_P12}"
            export CSC_KEY_PASSWORD="${APPLE_CERTIFICATE_PASSWORD}"
          else
            echo "::warning::No Apple signing certificate is configured; packaging an UNSIGNED app. The verification step will fail, as intended."
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          if [ -n "${APPLE_API_KEY_P8}" ] && [ -n "${APPLE_API_KEY_ID}" ] && [ -n "${APPLE_API_ISSUER}" ]; then
            key_file="${RUNNER_TEMP}/AuthKey_notarize.p8"
            trap 'rm -f "${key_file}"' EXIT
            (umask 077 && printf '%s\n' "${APPLE_API_KEY_P8}" > "${key_file}")
            export APPLE_API_KEY="${key_file}"
          else
            echo "::warning::No App Store Connect API key is configured; the app will not be notarized."
            unset APPLE_API_KEY_ID APPLE_API_ISSUER
          fi
          unset APPLE_API_KEY_P8
          npx electron-builder --mac --publish never

      # Both architectures are checked: each .app is signed and notarized separately.
      - name: Verify the app is signed and notarized
        run: |
          apps=$(find release -maxdepth 2 -name "*.app")
          if [ -z "$apps" ]; then echo "No .app produced"; exit 1; fi
          while IFS= read -r APP; do
            echo "Checking $APP"
            codesign --verify --deep --strict --verbose=2 "$APP"
            # Fails the build if Gatekeeper would reject it on a user's machine
            spctl --assess --type execute --verbose=4 "$APP"
            # The notarization ticket is stapled, so it opens without a network check
            xcrun stapler validate "$APP"
          done <<< "$apps"

      # latest-mac.yml is the update feed electron-updater reads; the zips are
      # what Squirrel.Mac installs from (it cannot install from a dmg); the
      # blockmaps let it download only the changed chunks. Omitting any of the
      # three leaves auto-update broken while the release still looks complete.
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml
          if-no-files-found: error

  windows:
    needs: test
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run abi:electron
      - run: npm run desktop:build

      # No signing credentials in scope here — see the note above. Unsigned
      # builds show a SmartScreen prompt, which the README documents.
      - name: Package
        run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error

  # Publishing happens once, after both builds, so the two jobs can't race each
  # other and drop assets from the release.
  release:
    name: Publish release
    needs: [macos, windows]
    if: startsWith(github.ref, 'refs/tags/pennant-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Attach installers to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # -name patterns are quoted so the shell never glob-expands them
          find artifacts -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.zip' \
            -o -name '*.blockmap' -o -name 'latest.yml' -o -name 'latest-mac.yml' \) \
            -print0 > assets.zero
          tr '\0' '\n' < assets.zero

          # Asset names must survive upload byte-for-byte: electron-updater
          # fetches exactly the filenames listed in latest*.yml, and GitHub
          # rewrites spaces to dots. electron-builder's artifactName keeps them
          # space-free, so fail loudly here rather than shipping dead updates.
          if tr '\0' '\n' < assets.zero | grep -q ' '; then
            echo "::error::Release asset names contain spaces; update manifests would 404"
            exit 1
          fi

          # A failed create does NOT mean the release is already there. The old
          # blanket `|| echo "already exists"` read a GitHub 503 as exactly that
          # and went on to upload twelve assets to a release that was never
          # created — twelve "release not found" lines and a red run holding a
          # perfectly good pair of installers. Retry the create; only an explicit
          # "already exists" is a reason to skip it.
          created=
          for attempt in 1 2 3 4 5; do
            if out=$(gh release create "${GITHUB_REF_NAME}" \
                       --repo "${GITHUB_REPOSITORY}" \
                       --title "Pennant ${GITHUB_REF_NAME#pennant-v}" \
                       --generate-notes 2>&1); then
              created=yes
              echo "Release created"
              break
            fi
            echo "${out}"
            case "${out}" in
              *already*exists*)
                created=yes
                echo "Release already exists — uploading to it"
                break
                ;;
            esac
            echo "Create failed (attempt ${attempt}); GitHub may be having a moment"
            sleep $(( attempt * 15 ))
          done
          if [ -z "${created}" ]; then
            echo "::error::Could not create the release after 5 attempts"
            exit 1
          fi

          # Uploads get the same treatment for the same reason: one transient
          # 5xx should not cost the release an installer.
          upload() {
            for attempt in 1 2 3 4 5; do
              gh release upload "${GITHUB_REF_NAME}" "$1" \
                --repo "${GITHUB_REPOSITORY}" --clobber && return 0
              echo "Upload of $1 failed (attempt ${attempt})"
              sleep $(( attempt * 15 ))
            done
            echo "::error::Could not upload $1"
            return 1
          }
          while IFS= read -r -d '' asset; do
            upload "${asset}" || exit 1
          done < assets.zero

          # The manifests must be present or clients never learn a release exists
          gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --json assets -q '.assets[].name' > published.txt
          cat published.txt
          for f in latest-mac.yml latest.yml; do
            grep -qx "$f" published.txt \
              || { echo "::error::$f missing from the release — auto-update will not work"; exit 1; }
          done
